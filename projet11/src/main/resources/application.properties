spring.application.name=projet11
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update

############################################################
# GraphHopper API configuration
###########################################################
graphhopper.api.url=${GRAPHHOPPER_API_URL:http://localhost:8989}
# Timeouts (ms) : evite qu'un appel GraphHopper lent/bloque ne gele un thread de requete
graphhopper.connect-timeout-ms=3000
graphhopper.read-timeout-ms=5000
# Duree de vie (secondes) du cache d'itineraires, pour proteger le quota GraphHopper
graphhopper.cache-ttl-seconds=300

############################################################
# Actuator : exposition explicitement restreinte a "health".
###########################################################
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never