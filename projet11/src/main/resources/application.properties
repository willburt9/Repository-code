spring.application.name=projet11
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update

############################################################
# OpenRouteService API configuration
###########################################################
openrouteservice.api.key=${DISTANCE_API_KEY:}
openrouteservice.api.url=https://api.openrouteservice.org

# Timeouts (ms) : evite qu'un appel ORS lent/bloque ne gele un thread de requete
openrouteservice.connect-timeout-ms=3000
openrouteservice.read-timeout-ms=5000

# Duree de vie (secondes) du cache d'itineraires, pour proteger le quota ORS
openrouteservice.cache-ttl-seconds=300

############################################################
# Actuator : exposition explicitement restreinte a "health".
###########################################################
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never