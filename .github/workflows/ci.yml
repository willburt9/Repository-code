name: CI

on:
  push:
    branches:
      - main
      - Develop

  pull_request:
    branches:
      - main
      - Develop

jobs:

  ############################################################
  # BACKEND
  ############################################################

  backend:
    name: Backend - Tests & JaCoCo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests and JaCoCo
        working-directory: projet11
        run: |
          chmod +x mvnw
          ./mvnw clean verify

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: projet11/target/site/jacoco/


  ############################################################
  # FRONTEND
  ############################################################

  frontend:
    name: Frontend - Tests & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projet11/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projet11/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Generate coverage
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build


  ############################################################
  # CYPRESS
  ############################################################

  cypress:
    name: Cypress - E2E
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projet11/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: projet11/frontend
        run: npm ci


      ##########################################################
      # GRAPHHOPPER
      ##########################################################

      - name: Start GraphHopper
        working-directory: projet11/GraphHopper
        run: |
          nohup java -jar graphhopper-web-11.0.jar \
            server config.yml \
            > ../graphhopper.log 2>&1 &

      - name: Wait for GraphHopper
        working-directory: projet11/frontend
        run: |
          echo "===== Waiting for GraphHopper on port 8989 ====="

          for i in {1..90}; do

            if curl -fsS http://localhost:8989/ > /dev/null 2>&1; then
              echo "GraphHopper est prêt."
              exit 0
            fi

            if ! pgrep -f "graphhopper-web-11.0.jar" > /dev/null; then
              echo "❌ GraphHopper s'est arrêté."
              echo "===== LOGS GRAPHHOPPER ====="
              cat ../graphhopper.log
              exit 1
            fi

            echo "GraphHopper n'est pas encore prêt ($i/90)"
            sleep 2
          done

          echo "❌ Timeout : GraphHopper n'est pas disponible."
          echo "===== LOGS GRAPHHOPPER ====="
          cat ../graphhopper.log
          exit 1


      ##########################################################
      # SPRING BOOT
      ##########################################################

      - name: Start Spring Boot
        working-directory: projet11
        run: |
          chmod +x mvnw

          nohup ./mvnw spring-boot:run \
            > backend.log 2>&1 &

      - name: Wait for Spring Boot
        working-directory: projet11/frontend
        run: |
          npx wait-on http://localhost:8080/actuator/health


      ##########################################################
      # FRONTEND
      ##########################################################

      - name: Start frontend
        working-directory: projet11/frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: |
          nohup npm run dev -- --host 0.0.0.0 \
            > frontend.log 2>&1 &

      - name: Wait for frontend
        working-directory: projet11/frontend
        run: |
          npx wait-on http://localhost:5173


      ##########################################################
      # CYPRESS
      ##########################################################

      - name: Run Cypress
        working-directory: projet11/frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: npx cypress run


      ##########################################################
      # ARTIFACTS
      ##########################################################

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: projet11/frontend/cypress/screenshots/

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: projet11/frontend/cypress/videos/