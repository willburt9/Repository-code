name: CI

on:
  push:
    branches:
    - main
    - Develop
  pull_request:
    branches:
    - main
    - Develop

jobs:

  ############################################################
  # BACKEND
  ############################################################

  backend:
    name: Backend - Tests & JaCoCo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify backend structure
        run: |
          pwd
          ls -la
          echo "===== Projet11 ====="
          ls -la projet11
          echo "===== Maven wrapper ====="
          ls -la projet11/mvnw
          echo "===== pom.xml ====="
          ls -la projet11/pom.xml

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Maven wrapper executable
        run: chmod +x projet11/mvnw

      - name: Run tests and JaCoCo
        working-directory: projet11
        run: ./mvnw clean verify

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: projet11/target/site/jacoco/

  ############################################################
  # FRONTEND
  ############################################################

  frontend:
    name: Frontend - Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify frontend structure
        run: |
          ls -la projet11/frontend
          ls -la projet11/frontend/package.json
          ls -la projet11/frontend/package-lock.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: projet11/frontend
        run: npm ci

      - name: Run tests
        working-directory: projet11/frontend
        run: npm run test:run

      - name: Generate coverage
        working-directory: projet11/frontend
        run: npm run test:coverage

      - name: Build frontend
        working-directory: projet11/frontend
        run: npm run build


  ############################################################
  # CYPRESS
  ############################################################

  cypress:
    name: Cypress - E2E
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:

      ########################################################
      # CHECKOUT
      ########################################################

      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true


      ########################################################
      # GIT LFS
      ########################################################

      - name: Verify Git LFS
        run: |
          echo "===== Git LFS ====="
          git lfs version
          git lfs ls-files


      ########################################################
      # VERIFICATION GRAPHHOPPER
      ########################################################

      - name: Verify GraphHopper files
        working-directory: projet11/GraphHopper
        run: |
          echo "===== GraphHopper directory ====="
          ls -lh

          echo ""
          echo "===== OSM file ====="
          ls -lh ile-de-france-260810.osm.pbf

      ########################################################
      # JAVA 21
      ########################################################

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      ########################################################
      # NODE.JS 22
      ########################################################

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projet11/frontend/package-lock.json

      ########################################################
      # INSTALL FRONTEND DEPENDENCIES
      ########################################################

      - name: Install frontend dependencies
        working-directory: projet11/frontend
        run: npm ci


      ########################################################
      # GRAPHHOPPER
      ########################################################

      - name: Start GraphHopper
        working-directory: projet11/GraphHopper
        run: |
          echo "===== Starting GraphHopper ====="

          nohup java -Xmx4G \
            -jar graphhopper-web-11.0.jar \
            server config.yml \
            > ../graphhopper.log 2>&1 &

          echo $! > ../graphhopper.pid

          echo "GraphHopper PID: $(cat ../graphhopper.pid)"


      ########################################################
      # WAIT FOR GRAPHHOPPER
      ########################################################

      - name: Wait for GraphHopper
        working-directory: projet11
        run: |
          echo "===== Waiting for GraphHopper on port 8989 ====="

          for i in {1..90}; do

            # Vérifie si le processus Java existe toujours
            if ! kill -0 $(cat graphhopper.pid) 2>/dev/null; then
              echo "❌ GraphHopper s'est arrêté."
              echo ""
              echo "===== LOGS GRAPHHOPPER ====="
              cat graphhopper.log || true
              exit 1
            fi

            # Vérifie que l'API répond
            if curl -sf http://localhost:8989/ > /dev/null; then
              echo "✅ GraphHopper est prêt."
              exit 0
            fi

            echo "GraphHopper n'est pas encore prêt ($i/90)"
            sleep 2

          done

          echo "❌ GraphHopper n'a pas démarré après 3 minutes."
          echo ""
          echo "===== LOGS GRAPHHOPPER ====="
          cat graphhopper.log || true

          exit 1


      ########################################################
      # SPRING BOOT
      ########################################################

      - name: Start Spring Boot
        working-directory: projet11
        run: |
          echo "===== Starting Spring Boot ====="

          chmod +x mvnw

          nohup ./mvnw spring-boot:run \
            > backend.log 2>&1 &

          echo $! > backend.pid

          echo "Spring Boot PID: $(cat backend.pid)"


      ########################################################
      # WAIT FOR SPRING BOOT
      ########################################################

      - name: Wait for Spring Boot
        working-directory: projet11
        run: |
          echo "===== Waiting for Spring Boot on port 8080 ====="

          for i in {1..60}; do

            if ! kill -0 $(cat backend.pid) 2>/dev/null; then
              echo "❌ Spring Boot s'est arrêté."
              echo ""
              echo "===== LOGS SPRING BOOT ====="
              cat backend.log || true
              exit 1
            fi

            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "✅ Spring Boot est prêt."
              exit 0
            fi

            echo "Spring Boot n'est pas encore prêt ($i/60)"
            sleep 2

          done

          echo "❌ Spring Boot n'a pas démarré."
          echo ""
          echo "===== LOGS SPRING BOOT ====="
          cat backend.log || true

          exit 1


      ########################################################
      # FRONTEND
      ########################################################

      - name: Start frontend
        working-directory: projet11/frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: |
          echo "===== Starting frontend ====="

          nohup npm run dev -- --host 0.0.0.0 \
            > ../frontend.log 2>&1 &

          echo $! > ../frontend.pid

          echo "Frontend PID: $(cat ../frontend.pid)"


      ########################################################
      # WAIT FOR FRONTEND
      ########################################################

      - name: Wait for frontend
        working-directory: projet11
        run: |
          echo "===== Waiting for frontend on port 5173 ====="

          for i in {1..60}; do

            if ! kill -0 $(cat frontend.pid) 2>/dev/null; then
              echo "❌ Frontend s'est arrêté."
              echo ""
              echo "===== LOGS FRONTEND ====="
              cat frontend.log || true
              exit 1
            fi

            if curl -sf http://localhost:5173 > /dev/null; then
              echo "✅ Frontend est prêt."
              exit 0
            fi

            echo "Frontend n'est pas encore prêt ($i/60)"
            sleep 2

          done

          echo "❌ Frontend n'a pas démarré."
          echo ""
          echo "===== LOGS FRONTEND ====="
          cat frontend.log || true

          exit 1


      ########################################################
      # CYPRESS
      ########################################################

      - name: Run Cypress
        working-directory: projet11/frontend
        run: npx cypress run


      ########################################################
      # CYPRESS SCREENSHOTS
      ########################################################

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: projet11/frontend/cypress/screenshots/
          if-no-files-found: ignore


      ########################################################
      # CYPRESS VIDEOS
      ########################################################

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: projet11/frontend/cypress/videos/
          if-no-files-found: ignore


      ########################################################
      # LOGS
      ########################################################

      - name: Upload application logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-logs
          path: |
            projet11/graphhopper.log
            projet11/backend.log
            projet11/frontend.log
          if-no-files-found: ignore

  ############################################################
  # SEMANTIC-RELEASE
  ############################################################
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend
      - cypress

    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Develop')

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projet11/package-lock.json

      - name: Install dependencies
        working-directory: projet11
        run: npm ci

      - name: Semantic Release
        working-directory: projet11
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ############################################################
  # DOCKER / GHCR
  ############################################################

  docker:
    name: Docker - Build & Push Images
    runs-on: ubuntu-latest

    needs:
      - semantic-release

    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Develop')

    permissions:
      contents: read
      packages: write

    steps:
      ##########################################################
      # CHECKOUT
      ##########################################################

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      ##########################################################
      # GET VERSION
      ##########################################################

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(git describe --tags --abbrev=0)

          VERSION=${VERSION#v}

          echo "Version detected: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      ##########################################################
      # LOGIN GHCR
      ##########################################################

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      ##########################################################
      # BACKEND IMAGE
      ##########################################################

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./projet11
          file: ./projet11/Dockerfile

          push: true

          tags: |
            ghcr.io/${{ github.repository_owner }}/projet11-backend:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/projet11-backend:latest


      ##########################################################
      # FRONTEND IMAGE
      ##########################################################

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./projet11/frontend
          file: ./projet11/frontend/Dockerfile

          push: true
          build-args: |
            VITE_API_BASE_URL=http://localhost:8080
          tags: |
            ghcr.io/${{ github.repository_owner }}/projet11-frontend:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/projet11-frontend:latest