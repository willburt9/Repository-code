name: CI

on:
  push:
    branches:
    - main
    - Develop
  pull_request:
    branches:
    - main
    - Develop

jobs:

  ############################################################
  # BACKEND
  ############################################################

  backend:
    name: Backend - Tests & JaCoCo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify backend structure
        run: |
          pwd
          ls -la
          echo "===== Projet11 ====="
          ls -la projet11
          echo "===== Maven wrapper ====="
          ls -la projet11/mvnw
          echo "===== pom.xml ====="
          ls -la projet11/pom.xml

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Maven wrapper executable
        run: chmod +x projet11/mvnw

      - name: Run tests and JaCoCo
        working-directory: projet11
        run: ./mvnw clean verify

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: projet11/target/site/jacoco/


  ############################################################
  # FRONTEND
  ############################################################

  frontend:
    name: Frontend - Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify frontend structure
        run: |
          ls -la projet11/frontend
          ls -la projet11/frontend/package.json
          ls -la projet11/frontend/package-lock.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: projet11/frontend
        run: npm ci

      - name: Run tests
        working-directory: projet11/frontend
        run: npm run test:run

      - name: Generate coverage
        working-directory: projet11/frontend
        run: npm run test:coverage

      - name: Build frontend
        working-directory: projet11/frontend
        run: npm run build


  ############################################################
  # CYPRESS
  ############################################################

  cypress:
    name: Cypress - E2E
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Make Maven wrapper executable
        run: chmod +x projet11/mvnw

      ########################################################
      # Frontend dependencies
      ########################################################

      - name: Install frontend dependencies
        working-directory: projet11/frontend
        run: npm ci

      ########################################################
      # GraphHopper
      ########################################################

      - name: Verify GraphHopper
        run: |
          ls -la projet11/GraphHopper
          ls -la projet11/GraphHopper/graphhopper-web-11.0.jar
          ls -la projet11/GraphHopper/config.yml

      - name: Start GraphHopper
        working-directory: projet11
        run: |
          nohup java -jar GraphHopper/graphhopper-web-11.0.jar \
            server GraphHopper/config.yml \
            > graphhopper.log 2>&1 &

      - name: Wait for GraphHopper
        working-directory: projet11/frontend
        run: npx wait-on http://localhost:8989

      ########################################################
      # Spring Boot
      ########################################################

      - name: Start Spring Boot
        working-directory: projet11
        run: |
          nohup ./mvnw spring-boot:run \
            > backend.log 2>&1 &

      - name: Wait for Spring Boot
        working-directory: projet11/frontend
        run: npx wait-on http://localhost:8080/actuator/health

      ########################################################
      # Frontend
      ########################################################

      - name: Start frontend
        working-directory: projet11/frontend
        run: |
          nohup npm run dev -- --host 0.0.0.0 \
            > frontend.log 2>&1 &

      - name: Wait for frontend
        working-directory: projet11/frontend
        run: npx wait-on http://localhost:5173

      ########################################################
      # Cypress
      ########################################################

      - name: Run Cypress
        working-directory: projet11/frontend
        run: npx cypress run

      ########################################################
      # Logs en cas d'échec
      ########################################################

      - name: Display application logs
        if: failure()
        working-directory: projet11
        run: |
          echo "===== GraphHopper ====="
          cat graphhopper.log || true

          echo "===== Spring Boot ====="
          cat backend.log || true

          echo "===== Frontend ====="
          cat frontend/frontend.log || true

      ########################################################
      # Cypress artifacts
      ########################################################

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: projet11/frontend/cypress/screenshots/

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: projet11/frontend/cypress/videos/