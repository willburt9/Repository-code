name: CI

on:
  push:
  pull_request:
    branches:
      - main
      - Develop

jobs:

  ############################################################
  # BACKEND
  ############################################################

  backend:
    name: Backend - Tests & JaCoCo
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Projet11

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests and JaCoCo
        run: ./mvnw clean verify

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: Projet11/target/site/jacoco/


  ############################################################
  # FRONTEND
  ############################################################

  frontend:
    name: Frontend - Tests & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Projet11/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Projet11/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Generate coverage
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build


  ############################################################
  # CYPRESS
  ############################################################

  cypress:
    name: Cypress - E2E
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Projet11/frontend/package-lock.json

      - name: Make Maven wrapper executable
        working-directory: Projet11
        run: chmod +x mvnw

      - name: Install frontend dependencies
        working-directory: Projet11/frontend
        run: npm ci

      ########################################################
      # GraphHopper
      ########################################################

      - name: Start GraphHopper
        working-directory: Projet11
        run: |
          nohup java -jar graphhopper/graphhopper-web-11.0.jar \
            server graphhopper/config.yml \
            > graphhopper.log 2>&1 &

      - name: Wait for GraphHopper
        working-directory: Projet11/frontend
        run: npx wait-on http://localhost:8989

      ########################################################
      # Spring Boot
      ########################################################

      - name: Start Spring Boot
        working-directory: Projet11
        run: |
          nohup ./mvnw spring-boot:run \
            > backend.log 2>&1 &

      - name: Wait for Spring Boot
        working-directory: Projet11/frontend
        run: npx wait-on http://localhost:8080/actuator/health

      ########################################################
      # React / Vite
      ########################################################

      - name: Start frontend
        working-directory: Projet11/frontend
        run: |
          nohup npm run dev -- --host 0.0.0.0 \
            > frontend.log 2>&1 &

      - name: Wait for frontend
        working-directory: Projet11/frontend
        run: npx wait-on http://localhost:5173

      ########################################################
      # Cypress
      ########################################################

      - name: Run Cypress
        working-directory: Projet11/frontend
        run: npx cypress run

      ########################################################
      # Logs en cas d'échec
      ########################################################

      - name: Display application logs
        if: failure()
        run: |
          echo "===== GraphHopper ====="
          cat Projet11/graphhopper.log || true

          echo "===== Spring Boot ====="
          cat Projet11/backend.log || true

          echo "===== Frontend ====="
          cat Projet11/frontend/frontend.log || true

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: Projet11/frontend/cypress/screenshots/

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: Projet11/frontend/cypress/videos/